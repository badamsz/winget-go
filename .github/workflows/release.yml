name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build all targets
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="windows/amd64 windows/arm64 windows/386 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            GOOS="${t%/*}"; GOARCH="${t#*/}"
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            name="winget-go-${VERSION}-${GOOS}-${GOARCH}"
            mkdir -p "build/$name"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
              -ldflags "-s -w -X winget-go/internal/config.Version=${VERSION#v}" \
              -o "build/$name/winget-go${ext}" ./cmd/winget-go
            cp README.md CHANGELOG.md LICENSE winget-go.env.example "build/$name/"
            if [ "$GOOS" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The "## [x.y.z]" section for this tag, up to the next heading
          # or the link references at the bottom.
          awk -v v="${VERSION#v}" '
            /^## \[/ { if (on) exit; on = index($0, "[" v "]") > 0; next }
            /^\[[^]]+\]: / { if (on) exit }
            on
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for ${VERSION#v}"
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "winget-go ${{ github.ref_name }}" --notes-file notes.md --verify-tag
