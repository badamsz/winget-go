name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build all targets
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          targets="windows/amd64 windows/arm64 windows/386 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for t in $targets; do
            GOOS="${t%/*}"; GOARCH="${t#*/}"
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            name="winget-go-${VERSION}-${GOOS}-${GOARCH}"
            mkdir -p "build/$name"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
              -ldflags "-s -w -X winget-go/internal/config.Version=${VERSION#v}" \
              -o "build/$name/winget-go${ext}" ./cmd/winget-go
            cp README.md winget-go.env.example LICENSE* "build/$name/" 2>/dev/null || true
            if [ "$GOOS" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --generate-notes --verify-tag
